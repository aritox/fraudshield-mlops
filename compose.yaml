name: fraudshield

x-database-environment: &database-environment
  FRAUDSHIELD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${FRAUDSHIELD_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: fraudshield-api:phase2c
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database-environment
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    image: fraudshield-api:phase2c
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *database-environment
      FRAUDSHIELD_MODEL_URI: /opt/fraudshield/model/production_sgd
      FRAUDSHIELD_MODEL_PACKAGE_MANIFEST: /opt/fraudshield/artifacts/container/model_package_manifest.json
      FRAUDSHIELD_REPOSITORY_ROOT: /opt/fraudshield
    ports:
      - "127.0.0.1:${FRAUDSHIELD_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:

networks:
  default:
    name: fraudshield_private
