global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/fraudshield.rules.yml

scrape_configs:
  - job_name: fraudshield-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: fraudshield-monitor
    metrics_path: /metrics
    static_configs:
      - targets:
          - monitor:8001

  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets:
          - prometheus:9090
