[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudshield-mlops"
version = "0.1.0"
description = "End-to-end fraud detection MLOps platform built with open-source Python tools."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "FraudShield Contributors" }
]
license = { text = "MIT" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "kagglehub",
  "pandas",
  "numpy",
  "scikit-learn",
  "xgboost",
  "imbalanced-learn",
  "pyarrow",
  "matplotlib",
  "joblib",
  "pydantic",
  "pydantic-settings",
  "python-dotenv",
  "PyYAML",
  "mlflow>=3,<4"
]

[project.optional-dependencies]
dev = [
  "jupyterlab",
  "ipykernel",
  "pytest",
  "pytest-cov",
  "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
