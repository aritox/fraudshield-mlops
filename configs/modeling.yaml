batch_size: 250000
random_seed: 42
training_epochs: 3

train_path: data/processed/train.parquet
validation_path: data/processed/validation.parquet

selection_metric: average_precision
threshold_metric: f_beta
threshold_beta: 2.0

top_k_percentages:
  - 0.1
  - 0.5
  - 1.0

models:
  unweighted_logistic:
    loss: log_loss
    penalty: l2
    alpha: 0.0001
    learning_rate: optimal
    average: true

  weighted_logistic:
    loss: log_loss
    penalty: l2
    alpha: 0.0001
    learning_rate: optimal
    average: true
